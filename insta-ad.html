<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인스타 광고 4:5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #0B0B0C; overflow: hidden; }
  body {
    font-family: Pretendard, "Malgun Gothic", sans-serif; color: #fff;
    word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  .ad { position: relative; width: 1080px; height: 1350px; padding: 72px 76px; overflow: hidden; }
  .ad::before {
    content: ""; position: absolute; right: -260px; top: 180px; width: 1000px; height: 1000px;
    background: radial-gradient(circle, rgba(255,90,0,.55), rgba(255,90,0,0) 62%);
  }
  .ad > * { position: relative; }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 40px; font-weight: 900; letter-spacing: -0.02em; }
  .logo span { color: #FF7A2E; }
  .tag {
    font-size: 28px; font-weight: 800; color: #FF7A2E;
    border: 3px solid rgba(255,122,46,.7); background: rgba(255,90,0,.1);
    padding: 12px 26px; border-radius: 999px;
  }

  .hook { margin-top: 78px; font-size: 52px; font-weight: 800; line-height: 1.3; letter-spacing: -0.03em; color: #E6E6EA; }
  .hook b { color: #fff; }

  .pct {
    margin-top: 10px; font-size: 330px; font-weight: 900; line-height: .9; letter-spacing: -0.07em;
    color: #FF6A13; text-shadow: 0 20px 80px rgba(255,90,0,.5);
  }
  .pct small { font-size: 120px; letter-spacing: -0.03em; color: #fff; margin-left: 14px; }
  .head { margin-top: 18px; font-size: 76px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; }

  .price { margin-top: 34px; display: flex; align-items: baseline; gap: 22px; }
  .price del { font-size: 40px; color: #8A8A94; font-weight: 600; }
  .price strong { font-size: 64px; font-weight: 900; letter-spacing: -0.03em; }
  .price em { font-style: normal; font-size: 32px; color: #C8C8CF; font-weight: 600; }

  .chips { margin-top: 46px; display: flex; gap: 16px; flex-wrap: wrap; }
  .chip {
    font-size: 30px; font-weight: 700; padding: 14px 26px; border-radius: 16px;
    background: #1D1D20; border: 2px solid #2E2E34; color: #E6E6EA;
  }

  .cta {
    position: absolute; left: 76px; right: 76px; bottom: 72px;
    background: #FF5A00; border-radius: 28px; padding: 34px 40px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 30px 60px -24px rgba(255,90,0,.9);
  }
  .cta .l b { display: block; font-size: 46px; font-weight: 900; letter-spacing: -0.03em; }
  .cta .l span { display: block; margin-top: 6px; font-size: 28px; font-weight: 600; opacity: .9; }
  .cta .arrow {
    width: 96px; height: 96px; border-radius: 50%; background: #fff; color: #FF5A00;
    display: grid; place-items: center; font-size: 54px; font-weight: 900;
  }
  .note { position: absolute; right: 80px; bottom: 26px; font-size: 20px; color: #55555D; }
</style>
</head>
<body>
  <div class="ad">
    <div class="top">
      <div class="logo">CLASS<span>101</span></div>
      <div class="tag">첫 구독 한정</div>
    </div>

    <p class="hook">취업 준비도, 스킬업도, 퇴근 후 취미도<br><b>구독 하나로 전부.</b></p>

    <div class="pct">50%<small>OFF</small></div>
    <div class="head">첫 달 구독료 반값</div>

    <div class="price">
      <del>월 19,900원</del>
      <strong>월 9,950원</strong>
      <em>첫 달</em>
    </div>

    <div class="chips">
      <span class="chip">취업 준비</span>
      <span class="chip">커리어 스킬업</span>
      <span class="chip">퇴근 후 취미</span>
      <span class="chip">모든 클래스 무제한</span>
    </div>

    <div class="cta">
      <div class="l">
        <b>지금 구독하고 50% 받기</b>
        <span>이번 달 말 마감 · 선착순 5,000명</span>
      </div>
      <div class="arrow">→</div>
    </div>
    <div class="note">교육용 실습 예시 · 가격은 예시입니다</div>
  </div>
</body>
</html>
